<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Expander</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="app">

        <div id="login-view" class="view">
            <div class="flex items-center justify-center min-h-screen">
                <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-xl shadow-lg">
                    <h2 class="text-3xl font-bold text-center text-slate-800">Login</h2>
                    <div id="login-success-message" class="hidden text-sm text-center text-green-700 bg-green-100 p-3 rounded-md"></div>
                    <form id="login-form" class="space-y-6">
                        <div>
                            <label for="login-email" class="block text-sm font-medium text-slate-600">Email</label>
                            <input id="login-email" name="email" type="email" required class="w-full px-3 py-2 mt-1 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="login-password" class="block text-sm font-medium text-slate-600">Senha</label>
                            <input id="login-password" name="password" type="password" required class="w-full px-3 py-2 mt-1 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div id="login-error" class="hidden text-sm text-center text-red-600"></div>
                        <div>
                            <button type="submit" class="w-full px-4 py-2 font-semibold text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:bg-blue-400">Entrar</button>
                        </div>
                        <p class="text-sm text-center text-slate-600">
                            Não tem uma conta? <a href="#signup" class="font-medium text-blue-600 hover:underline">Registe-se</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
        <div id="signup-view" class="view">
            <div class="flex items-center justify-center min-h-screen">
                <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-xl shadow-lg">
                    <h2 class="text-3xl font-bold text-center text-slate-800">Criar Conta</h2>
                    <form id="signup-form" class="space-y-6">
                        <div>
                            <label for="signup-firstname" class="block text-sm font-medium text-slate-600">Nome</label>
                            <input id="signup-firstname" name="firstname" type="text" required class="w-full px-3 py-2 mt-1 border border-slate-300 rounded-md">
                        </div>
                        <div>
                            <label for="signup-lastname" class="block text-sm font-medium text-slate-600">Apelido</label>
                            <input id="signup-lastname" name="lastname" type="text" required class="w-full px-3 py-2 mt-1 border border-slate-300 rounded-md">
                        </div>
                        <div>
                            <label for="signup-username" class="block text-sm font-medium text-slate-600">Nome de utilizador</label>
                            <input id="signup-username" name="username" type="text" required class="w-full px-3 py-2 mt-1 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="signup-email" class="block text-sm font-medium text-slate-600">Email</label>
                            <input id="signup-email" name="email" type="email" required class="w-full px-3 py-2 mt-1 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="signup-password" class="block text-sm font-medium text-slate-600">Senha</label>
                            <input id="signup-password" name="password" type="password" required class="w-full px-3 py-2 mt-1 border border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div id="signup-error" class="hidden text-sm text-center text-red-600"></div>
                        <div>
                            <button type="submit" class="w-full px-4 py-2 font-semibold text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:bg-blue-400">Registar</button>
                        </div>
                        <p class="text-sm text-center text-slate-600">
                            Já tem uma conta? <a href="#login" class="font-medium text-blue-600 hover:underline">Faça login</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>

        <div id="app-shell" class="view">
            <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
                    <a href="#profile" class="cursor-pointer group">
                        <h2 id="user-name" class="text-xl font-bold text-gray-800 group-hover:text-blue-600"></h2>
                        <p id="user-stats" class="text-sm text-gray-500"></p>
                    </a>
                    <div class="flex items-center gap-4">
                        <button id="new-deck-btn" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700">Novo Deck</button>
                        <button id="logout-btn" class="p-2 rounded-md text-slate-500 hover:bg-slate-100" title="Sair">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        </button>
                    </div>
                </div>
            </header>
            <main id="content-area" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10"></main>
        </div>

        <div id="new-deck-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex justify-center items-center p-4">
            <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
                <h2 class="text-2xl font-bold mb-6 text-slate-800">Criar Novo Deck</h2>
                <form id="new-deck-form" class="space-y-4">
                    <div>
                        <label for="deck-name" class="block text-sm font-medium text-slate-600 mb-1">Nome do Deck</label>
                        <input type="text" id="deck-name" required class="w-full px-3 py-2 border border-slate-300 rounded-md">
                    </div>
                    <div>
                        <label for="deck-word-lang" class="block text-sm font-medium text-slate-600 mb-1">Idioma das Palavras</label>
                        <select id="deck-word-lang" required class="w-full px-3 py-2 border border-slate-300 rounded-md"></select>
                    </div>
                    <div>
                        <label for="deck-expl-lang" class="block text-sm font-medium text-slate-600 mb-1">Idioma das Explicações</label>
                        <select id="deck-expl-lang" required class="w-full px-3 py-2 border border-slate-300 rounded-md"></select>
                    </div>
                    <div id="modal-error" class="hidden text-sm text-red-600"></div>
                    <div class="flex items-center justify-end gap-4 pt-4">
                        <button type="button" id="cancel-deck-btn" class="px-4 py-2 font-semibold text-slate-700 hover:bg-slate-100 rounded-md">Cancelar</button>
                        <button type="submit" class="px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700">Criar Deck</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div id="confirm-delete-deck-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex justify-center items-center p-4">
            <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
                <h2 class="text-2xl font-bold mb-4 text-slate-800">Confirmar Exclusão</h2>
                <p class="text-slate-600 mb-6">Tem a certeza que quer apagar o deck "<span id="deck-to-delete-name" class="font-semibold"></span>"? Esta ação não pode ser desfeita.</p>
                <div class="flex justify-center gap-4">
                    <button id="cancel-delete-deck-btn" class="px-6 py-2 font-semibold text-slate-700 hover:bg-slate-100 rounded-md">Cancelar</button>
                    <button id="confirm-delete-deck-btn" class="px-6 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700">Apagar</button>
                </div>
            </div>
        </div>

        <div id="edit-card-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex justify-center items-center p-4">
            <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg">
                <h2 class="text-2xl font-bold mb-6 text-slate-800">Editar Palavra</h2>
                <form id="edit-card-form" class="space-y-4">
                    <input type="hidden" id="edit-card-id">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Palavra</label>
                        <input type="text" id="edit-card-word" class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-md" readonly>
                    </div>
                    <div>
                        <label for="edit-card-meaning" class="block text-sm font-medium text-slate-600 mb-1">Significado</label>
                        <textarea id="edit-card-meaning" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label for="edit-card-example" class="block text-sm font-medium text-slate-600 mb-1">Exemplo</label>
                        <textarea id="edit-card-example" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-md"></textarea>
                    </div>
                    <div id="edit-card-error" class="hidden text-sm text-red-600"></div>
                    <div class="flex items-center justify-end gap-4 pt-4">
                        <button type="button" id="cancel-edit-card-btn" class="px-4 py-2 font-semibold text-slate-700 hover:bg-slate-100 rounded-md">Cancelar</button>
                        <button type="submit" class="px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
